{# Tema terang/gelap halaman hasil.
   Mekanisme: atribut data-theme pada <html> + CSS variables.
   Pilihan tema disimpan di localStorage (kunci spk-hasil-theme),
   default dark. Dipakai oleh base_dark.html. #}
<script>
(function () {
  var t = 'dark';
  try { t = localStorage.getItem('spk-hasil-theme') || 'dark'; } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
<style>
  html[data-theme="dark"], html:not([data-theme]) {
    color-scheme: dark;
    --th-bg: #0B1220;
    --th-surface: #0F172A;
    --th-surface-2: #1E293B;
    --th-hover: rgba(30, 41, 59, 0.45);
    --th-border: #1E293B;
    --th-border-strong: #334155;
    --th-text: #FFFFFF;
    --th-text-2: #E2E8F0;
    --th-text-3: #CBD5E1;
    --th-muted: #94A3B8;
    --th-faint: #64748B;
    --th-track: #1E293B;
    --th-bar: #6366F1;
    --th-accent: #8B5CF6;
    --th-accent-text: #C4B5FD;
    --th-accent-ring: rgba(139, 92, 246, 0.45);
    --th-accent-glow: rgba(139, 92, 246, 0.5);
    --th-row-hl: rgba(167, 139, 250, 0.07);
    --th-badge-k-bg: rgba(139, 92, 246, 0.15);
    --th-badge-d-bg: #1E293B;
    --th-badge-d-text: #CBD5E1;
    --th-btn2-bg: #1E293B;
    --th-btn2-bg-hover: #334155;
    --th-chart-grid: rgba(148, 163, 184, 0.10);
  }
  html[data-theme="light"] {
    color-scheme: light;
    --th-bg: #F8FAFC;
    --th-surface: #FFFFFF;
    --th-surface-2: #F1F5F9;
    --th-hover: #F1F5F9;
    --th-border: #E2E8F0;
    --th-border-strong: #CBD5E1;
    --th-text: #0F172A;
    --th-text-2: #1E293B;
    --th-text-3: #334155;
    --th-muted: #64748B;
    --th-faint: #94A3B8;
    --th-track: #E2E8F0;
    --th-bar: #4F46E5;
    --th-accent: #7C3AED;
    --th-accent-text: #7C3AED;
    --th-accent-ring: rgba(124, 58, 237, 0.35);
    --th-accent-glow: rgba(124, 58, 237, 0.28);

    --th-badge-k-bg: rgba(124, 58, 237, 0.10);

    --th-btn2-bg: #F1F5F9;
    --th-btn2-bg-hover: #E2E8F0;
    --th-chart-grid: rgba(100, 116, 139, 0.20);
  }

  /* Utilitas warna tema */
  body { background-color: var(--th-bg); color: var(--th-text-2); }
  .th-bg { background-color: var(--th-bg); }
  .th-text { color: var(--th-text); }
  .th-text-2 { color: var(--th-text-2); }
  .th-text-3 { color: var(--th-text-3); }
  .th-muted { color: var(--th-muted); }

  /* Navigasi sidebar */
  .th-nav {

    padding: 0.5rem 0.75rem; font-size: 0.875rem; color: var(--th-muted);
    transition: background-color 150ms ease, color 150ms ease;
  }
  .th-nav:hover { background-color: var(--th-hover); color: var(--th-text); }
  .th-nav svg { width: 1.25rem; height: 1.25rem; flex-shrink: 0; color: var(--th-faint); transition: color 150ms ease; }
  .th-nav:hover svg { color: var(--th-text-3); }
  .th-nav-active { background-color: var(--th-surface-2); font-weight: 500; color: var(--th-text); }
  .th-nav-active:hover { background-color: var(--th-surface-2); color: var(--th-text); }
  .th-nav-active svg { color: var(--th-bar); }
  .th-nav-active:hover svg { color: var(--th-bar); }

  /* Tombol toggle tema */
  .th-toggle {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2.5rem; height: 2.5rem; border-radius: 0.75rem; flex-shrink: 0;
    border: 1px solid var(--th-border-strong); background-color: var(--th-surface);
    color: var(--th-text-2);
    transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
  }
  .th-toggle:hover { background-color: var(--th-surface-2); color: var(--th-text); }
  .th-toggle:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--th-accent-ring); }
  .th-toggle svg { width: 1.25rem; height: 1.25rem; }

  /* Transisi halus saat ganti tema */
  body, .th-card, .th-rank1, .th-nav, .th-toggle, .th-btn-outline, .th-btn-secondary, .th-input {
    transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease;
  }
  @media (prefers-reduced-motion: reduce) {
    body, .th-card, .th-rank1, .th-nav, .th-toggle, .th-btn-outline, .th-btn-secondary, .th-input { transition: none; }
  }
</style>
