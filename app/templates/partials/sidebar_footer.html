{# Kaki sidebar: info pengguna + Keluar + toggle tema terang/gelap.
   Dipakai base.html dan base_dark.html. #}
<div class="px-5 py-4 th-bt">
  {% if current_user.is_authenticated %}
    <p class="text-sm font-semibold th-text-2">{{ current_user.nama or current_user.username }}</p>
    <p class="text-xs capitalize th-faint">{{ current_user.role }}</p>
    <div class="mt-3 flex items-center justify-between gap-2">
      <a href="{{ url_for('auth.logout') }}" class="inline-flex items-center gap-2 text-sm th-muted th-hover-text transition-colors">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Keluar
      </a>
      <button type="button" data-theme-toggle class="th-toggle" aria-label="Ganti tema">
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        <svg class="icon-moon hidden" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      </button>
    </div>
  {% endif %}
</div>
